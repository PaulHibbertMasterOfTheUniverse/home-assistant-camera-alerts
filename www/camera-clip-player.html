<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera event</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141b;color:white;font:16px system-ui}header{display:flex;gap:12px;align-items:center;padding:12px;flex-wrap:wrap}button,a{background:#28384b;color:white;padding:10px;border:0;border-radius:8px}#stage{height:75vh;overflow:hidden;touch-action:none;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain;transform-origin:center}#status{padding:12px}a[hidden]{display:none}
</style>
<header><strong>Camera event</strong><button id="reset">Reset zoom</button><button id="retry">Retry clip</button><a id="live" hidden>Live camera</a></header>
<p id="status" role="status">Loading clip…</p><div id="stage"><video controls playsinline autoplay muted></video></div>
<script>
const p=new URLSearchParams(location.search),v=document.querySelector("video"),s=document.querySelector("#status"),stage=document.querySelector("#stage");
const name=p.get("clip")||"",valid=/^camera_[a-z0-9_]+_\d{8}_\d{6}_\d{6}\.mp4$/.test(name);
const live=p.get("live")||"";if(/^\/(?!\/)[a-zA-Z0-9_/-]+$/.test(live)){const a=document.querySelector("#live");a.href=live;a.hidden=false;}
function load(){if(!valid){s.textContent="No valid clip specified.";return} s.textContent="Loading clip…";v.src="/local/camera-alerts/"+name+"?t="+Date.now();v.load();}
v.addEventListener("loadeddata",()=>{s.textContent="Pinch or use the mouse wheel to zoom. Drag to pan. Video controls play and pause.";v.play().catch(()=>{});});
v.addEventListener("error",()=>{s.textContent="Clip unavailable. Recording may still be finishing, may have failed, or may have been deleted. Tap Retry clip.";});
document.querySelector("#retry").onclick=load;
let scale=1,x=0,y=0;const points=new Map();let previous=null;
function draw(){v.style.transform=`translate(${x}px,${y}px) scale(${scale})`;}
function reset(){scale=1;x=y=0;draw();}document.querySelector("#reset").onclick=reset;
function geometry(){const a=[...points.values()];return {x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length,d:a.length>1?Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y):0};}
stage.addEventListener("pointerdown",e=>{if(e.clientY>stage.getBoundingClientRect().bottom-55)return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);previous=geometry();});
stage.addEventListener("pointermove",e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});const next=geometry();if(previous){if(next.d&&previous.d)scale=Math.max(1,Math.min(5,scale*next.d/previous.d));if(scale>1){x+=next.x-previous.x;y+=next.y-previous.y;}else{x=0;y=0}draw();}previous=next;});
function end(e){points.delete(e.pointerId);previous=points.size?geometry():null;}stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);stage.addEventListener("lostpointercapture",end);
stage.addEventListener("wheel",e=>{e.preventDefault();scale=Math.max(1,Math.min(5,scale*Math.exp(-e.deltaY*.001)));if(scale===1){x=0;y=0}draw();},{passive:false});load();
</script></html>
